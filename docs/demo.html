<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>prompt-autocomplete · demo</title>
<style>
  :root{
    --bg:#0a0b0f; --panel:#12141b; --stroke:#242936; --text:#f2f4f8;
    --muted:#8b93a7; --accent:#8b7bff; --accent2:#57d9a3; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1440px;height:900px;overflow:hidden}
  body{
    background:
      radial-gradient(900px 420px at 12% -10%, rgba(139,123,255,.26), transparent 60%),
      radial-gradient(700px 380px at 100% 110%, rgba(87,217,163,.14), transparent 62%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  .stage{width:1000px;display:flex;flex-direction:column;gap:22px}
  .kicker{display:flex;align-items:center;gap:12px;font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#a99cff}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 14px var(--accent2)}
  .composer{
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--stroke); border-radius:18px; padding:18px 20px 14px;
    box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .bar{
    display:flex;align-items:center;gap:14px;min-height:30px;
    font:500 14px/1.25 var(--mono); margin-bottom:14px;
    opacity:0; transform:translateY(3px); transition:opacity .16s ease, transform .16s ease;
  }
  .bar.on{opacity:1;transform:none}
  .l{display:flex;align-items:center;gap:9px;min-width:0;flex:1;overflow:hidden}
  .bolt{color:#a99cff;flex:none}
  .prompt{white-space:pre;overflow:hidden;text-overflow:ellipsis}
  .typed{color:#8f97ab}
  .ghost{color:#b6a8ff;font-weight:650}
  .legend{flex:none;color:#6f778a;font:500 12.5px/1 var(--mono);white-space:pre;display:flex;gap:8px;align-items:center}
  .legend .sep{color:#3a4153}
  .legend .k{border:1px solid transparent;border-radius:6px;padding:3px 6px;color:#ccd3e2;transition:all .12s ease}
  .legend .k.dim{color:#6f778a}
  .legend .k.hl{border-color:#8b7bff;background:rgba(139,123,255,.16);color:#e6e1ff}
  .dir{flex:none;color:#57d9a3;font:600 12.5px/1 var(--mono);letter-spacing:.06em}
  .input{display:flex;align-items:center;gap:2px;color:#e7ebf5;font-size:20px;min-height:44px;line-height:1.4}
  .input .txt{white-space:pre-wrap}
  .caret{width:2px;height:24px;background:#b6a8ff;animation:blink 1.05s steps(1) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}
  .row{display:flex;align-items:center;justify-content:space-between;color:#6f778a;font:500 12px/1 var(--mono);padding-top:14px;border-top:1px solid rgba(36,41,54,.55);margin-top:12px}
  .badges{display:flex;gap:8px}
  .badge{border:1px solid var(--stroke);border-radius:999px;padding:5px 10px;color:#c3cad9}
  /* unique selling points */
  .usp{display:flex;gap:14px}
  .card{
    flex:1;display:flex;align-items:center;gap:12px;
    border:1px solid var(--stroke);border-radius:14px;padding:13px 16px;
    background:rgba(18,20,27,.55);
    opacity:.32;transition:opacity .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease;
  }
  .card.on{
    opacity:1;border-color:rgba(139,123,255,.55);
    background:linear-gradient(180deg,rgba(139,123,255,.14),rgba(139,123,255,.04));
    box-shadow:0 0 0 1px rgba(139,123,255,.12), 0 12px 40px rgba(139,123,255,.18);
  }
  .card .big{font:680 24px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.02em;color:#eae7ff;white-space:nowrap}
  .card .lbl{font:500 13px/1.35 -apple-system,BlinkMacSystemFont,sans-serif;color:#9aa3b8}
  .card .lbl b{color:#cfd5e4;font-weight:620}
  .caption{height:22px;color:#8b93a7;font:500 15px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center}
  .caption b{color:#e7ebf5;font-weight:620}
</style>
</head>
<body>
<div class="stage">
  <div class="kicker"><span class="dot"></span>Hermes Desktop<span style="color:#4d5468">/</span>prompt-autocomplete</div>

  <div class="composer">
    <div class="bar" id="bar">
      <div class="l">
        <span class="bolt">⚡</span>
        <span class="prompt"><span class="typed" id="typed"></span><span class="ghost" id="ghost"></span></span>
      </div>
      <span class="dir" id="dir"></span>
      <div class="legend" id="legend"></div>
    </div>
    <div class="input" id="input"><span class="txt" id="txt"></span><span class="caret" id="caret"></span></div>
    <div class="row">
      <div class="badges"><span class="badge">two-tier: local trie + fast small model</span><span class="badge">no DOM rewrite</span></div>
      <div>Hermes Agent · v0.22</div>
    </div>
  </div>

  <div class="usp">
    <div class="card" id="u1"><span class="big">&lt;1 ms</span><span class="lbl">local phrase match, <b>off the main thread</b></span></div>
    <div class="card" id="u2"><span class="big">your prompts</span><span class="lbl">trained on <b>your own history</b>, on device</span></div>
  </div>

  <div class="caption" id="caption"></div>
</div>

<script>
const EN_TYPED = 'can you check the lo';
const EN_FULL  = 'can you check the logs and see what failed';
const HE_TYPED = 'תבדוק מה המצב';
const HE_FULL  = 'תבדוק מה המצב של השרתים בפרודקשן';

// timeline (ms)
const T = {
  type1:  [400, 2200],
  hold1:  [2200, 3600],
  key1:   [3600, 4050],
  commit1:[4050, 4250],
  usp:    [4250, 5600],
  type2:  [5600, 7400],
  hold2:  [7400, 8800],
  key2:   [8800, 9250],
  commit2:[9250, 9450],
  end:    [9450, 10800]
};
const DURATION = 10800;

const el = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const prog = (t, [a,b]) => clamp((t-a)/(b-a), 0, 1);

function legend(dir, hlKey) {
  const parts = dir === 'rtl' ? ['← full', 'Ctrl+← word', 'Tab'] : ['→ full', 'Ctrl+→ word', 'Tab'];
  return parts.map(p => `<span class="k${hlKey && p === hlKey ? ' hl' : ' dim'}">${p}</span>`)
    .join('<span class="sep">·</span>');
}

function seek(t) {
  const bar = el('bar'), typedEl = el('typed'), ghostEl = el('ghost');
  const txt = el('txt'), dirEl = el('dir'), legEl = el('legend'), cap = el('caption');
  const u1 = el('u1'), u2 = el('u2');

  let typed = '', full = '', dir = 'ltr', showBar = false, hlKey = null, caption = '';
  let usp1 = false, usp2 = false;

  if (t < T.usp[0]) {
    const n = Math.round(EN_TYPED.length * prog(t, T.type1));
    typed = EN_TYPED.slice(0, n);
    full = EN_FULL;
    showBar = typed.length >= 3;
    if (t >= T.key1[0] && t < T.commit1[0]) {
      hlKey = 'Tab';
      caption = '<b>LTR</b> detected — Tab or → accepts the sentence';
    } else if (t >= T.commit1[0]) {
      typed = EN_FULL;
      showBar = false;
      caption = 'Committed through <b>host.composer.setDraft</b> — editor DOM untouched';
    } else if (showBar) {
      caption = '<b>LTR</b> — the bar names the direction and the keys that work';
      usp1 = true;
    } else {
      caption = 'Typing…';
    }
  } else if (t < T.usp[1]) {
    typed = EN_FULL;
    caption = 'Matched <b>locally in under a millisecond</b> — nothing left the machine';
    usp1 = true; usp2 = true;
  } else if (t < T.commit2[0]) {
    const n = Math.round(HE_TYPED.length * prog(t, T.type2));
    typed = HE_TYPED.slice(0, n);
    full = HE_FULL;
    dir = 'rtl';
    showBar = typed.length >= 3;
    if (t >= T.key2[0]) {
      hlKey = '← full';
      caption = '<b>RTL</b> detected — ← or Ctrl+← for one word accepts';
    } else if (showBar) {
      caption = '<b>RTL</b> — same bar, mirrored keys, no toggle';
    } else {
      caption = 'Typing…';
    }
    usp1 = true; usp2 = true;
  } else {
    typed = HE_FULL;
    dir = 'rtl';
    caption = 'Hebrew committed — direction follows the text, not a setting';
    usp1 = true; usp2 = true;
  }

  if (showBar && full.toLowerCase().startsWith(typed.toLowerCase()) && full.length > typed.length + 1) {
    typedEl.textContent = typed;
    ghostEl.textContent = full.slice(typed.length);
    bar.classList.add('on');
  } else {
    bar.classList.remove('on');
    if (showBar) { typedEl.textContent = typed; ghostEl.textContent = ''; }
  }

  dirEl.textContent = dir === 'rtl' ? 'RTL' : 'LTR';
  legEl.innerHTML = legend(dir, hlKey);
  legEl.dir = 'ltr';

  txt.textContent = typed;
  txt.style.direction = dir;
  txt.style.unicodeBidi = 'plaintext';
  cap.innerHTML = caption;

  u1.classList.toggle('on', usp1);
  u2.classList.toggle('on', usp2);
}

// deterministic hook used by the frame capture loop
window.seek = seek;
window.DURATION = DURATION;
seek(0);
</script>
</body>
</html>
